<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Primary meta -->

    <!--
      PERFORMANCE NOTE (pre-launch action required):
      /public/safermockup.png  = 15 MB — convert to WebP, resize to 1200px wide (target <200 KB)
      /public/IMG_6242.JPG     = 4.3 MB at 5712×4284 — resize to 1200×900 and convert to WebP
      Use: `cwebp -q 82 safermockup.png -o safermockup.webp`
    -->

    <!-- JSON-LD: Organization + ProfessionalService -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://lumense.se/#organization",
          "name": "Lumense",
          "url": "https://lumense.se",
          "logo": {
            "@type": "ImageObject",
            "url": "https://lumense.se/logo-full.svg",
            "width": 180,
            "height": 40
          },
          "foundingDate": "2022",
          "description": "Independent creative studio in Stockholm specialising in branding, motion design, and graphic design for ambitious brands.",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Stockholm",
            "addressCountry": "SE"
          },
          "contactPoint": {
            "@type": "ContactPoint",
            "email": "hello@lumense.se",
            "contactType": "customer service"
          },
          "sameAs": [
            "https://instagram.com/lumense.studio",
            "https://dribbble.com/lumense"
          ]
        },
        {
          "@type": "ProfessionalService",
          "@id": "https://lumense.se/#service",
          "name": "Lumense",
          "url": "https://lumense.se",
          "description": "Branding agency, motion design studio, and graphic design consultancy based in Stockholm, Sweden.",
          "provider": { "@id": "https://lumense.se/#organization" },
          "areaServed": "Worldwide",
          "hasOfferCatalog": {
            "@type": "OfferCatalog",
            "name": "Creative Services",
            "itemListElement": [
              {
                "@type": "Offer",
                "itemOffered": {
                  "@type": "Service",
                  "name": "Branding & Visual Identity",
                  "description": "Brand strategy, visual identity systems, logo design, typography, and brand guidelines."
                }
              },
              {
                "@type": "Offer",
                "itemOffered": {
                  "@type": "Service",
                  "name": "Motion Design",
                  "description": "Brand films, title sequences, UI animation, social content, and motion style guides."
                }
              },
              {
                "@type": "Offer",
                "itemOffered": {
                  "@type": "Service",
                  "name": "Graphic Design",
                  "description": "Editorial design, campaign materials, packaging, print production, and art direction."
                }
              }
            ]
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
